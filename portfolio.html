<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio — Sato Studios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --bg-void: #050508;
      --glass-bg: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.08);
      --glass-border-hover: rgba(167,139,250,0.3);
      --purple-300: #c4b5fd;
      --purple-400: #a78bfa;
      --purple-500: #8b5cf6;
      --violet-500: #6366f1;
      --blue-400: #60a5fa;
      --text-primary: #f8fafc;
      --text-secondary: rgba(248,250,252,0.6);
      --text-muted: rgba(248,250,252,0.35);
      --gradient-hero: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #60a5fa 100%);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --font-ui: 'Space Grotesk', sans-serif;
      --radius-xl: 24px;
      --radius-md: 12px;
    }

    html { scroll-behavior: auto; }

    body {
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Noise */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 256px;
    }

    /* Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      filter: blur(80px);
    }
    .orb-a {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
      top: -100px; right: -100px;
      animation: orbA 14s ease-in-out infinite;
    }
    .orb-b {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      bottom: 10%; left: -80px;
      animation: orbA 18s ease-in-out infinite reverse;
    }
    @keyframes orbA {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(30px,-30px); }
    }

    /* Video BG */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
    }
    .video-bg video {
      width:100%; height:100%;
      object-fit:cover;
      opacity: 0.08;
    }
    .video-overlay {
      position:absolute; inset:0;
      background: rgba(5,5,8,0.75);
    }

    /* Home Button */
    .home-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.25s ease;
      animation: fadeIn 0.8s ease forwards;
    }
    .home-btn:hover {
      background: rgba(139,92,246,0.12);
      border-color: rgba(139,92,246,0.3);
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(139,92,246,0.15);
    }
    .home-btn svg { fill: var(--text-secondary); transition: fill 0.2s; }
    .home-btn:hover svg { fill: var(--text-primary); }

    @keyframes fadeIn {
      from { opacity:0; transform:scale(0.9); }
      to { opacity:1; transform:scale(1); }
    }

    /* Header */
    header {
      padding: 80px 60px 48px;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: headerIn 0.9s ease forwards;
    }
    @keyframes headerIn {
      from { opacity:0; transform:translateY(-30px); }
      to { opacity:1; transform:translateY(0); }
    }

    header h1 {
      font-family: var(--font-display);
      font-size: clamp(56px, 9vw, 110px);
      letter-spacing: 0.04em;
      color: var(--text-primary);
      line-height: 1;
    }

    header p {
      margin-top: 12px;
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Tag filter (decorative) */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 48px;
      flex-wrap: wrap;
      padding: 0 20px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.8s ease 0.3s both;
    }

    .filter-tag {
      padding: 7px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .filter-tag.active,
    .filter-tag:hover {
      background: rgba(139,92,246,0.1);
      border-color: rgba(139,92,246,0.3);
      color: var(--purple-300);
    }

    /* Gallery */
    .gallery {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 24px 80px;
      columns: 3;
      column-gap: 20px;
      position: relative;
      z-index: 1;
    }

    .gallery-item {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity 0.6s ease,
        transform 0.6s cubic-bezier(.16,1,.3,1),
        border-color 0.3s,
        box-shadow 0.3s;
    }

    .gallery-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-item:hover {
      border-color: var(--glass-border-hover);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 30px rgba(139,92,246,0.1);
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    .gallery-item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(5,5,8,0.8) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      align-items: flex-end;
      padding: 20px;
    }

    .gallery-item:hover .gallery-item-overlay {
      opacity: 1;
    }

    .gallery-item-label {
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5,5,8,0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: fadeIn 0.3s ease;
      cursor: pointer;
    }

    .modal-content {
      position: relative;
      z-index: 1;
      max-width: 88vw;
      max-height: 88vh;
    }

    .modal-content img {
      max-width: 100%;
      max-height: 88vh;
      border-radius: 20px;
      box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 60px rgba(139,92,246,0.1);
      animation: modalZoom 0.4s cubic-bezier(.16,1,.3,1);
    }

    @keyframes modalZoom {
      from { opacity:0; transform:scale(0.88); }
      to { opacity:1; transform:scale(1); }
    }

    .modal-close {
      position: fixed;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1001;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }

    .modal-close:hover {
      background: rgba(139,92,246,0.12);
      border-color: rgba(139,92,246,0.3);
    }

    .modal-close svg {
      stroke: var(--text-secondary);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-size: 13px;
      font-family: var(--font-ui);
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--glass-border);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .gallery { columns: 2; }
      header { padding: 80px 24px 36px; }
    }

    @media (max-width: 600px) {
      .gallery { columns: 1; padding: 0 16px 60px; }
      header h1 { font-size: 60px; }
    }
  </style>
</head>

<body>

  <!-- Orbs -->
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <!-- Video BG -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="Fundo.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Home Button -->
  <a href="index.html" class="home-btn" aria-label="Voltar para o início">
    <svg viewBox="0 0 24 24" width="18" height="18">
      <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/>
    </svg>
  </a>

  <!-- Header -->
  <header>
    <h1>PORTFÓLIO</h1>
    <p>Contém direitos autorais · Santos · Sato Studios</p>
  </header>

  <!-- Filter Bar (decorative) -->
  <div class="filter-bar">
    <span class="filter-tag active">Todos</span>
    <span class="filter-tag">Banners</span>
    <span class="filter-tag">Motion</span>
    <span class="filter-tag">Identidade</span>
  </div>

  <!-- Gallery -->
  <main class="gallery">
    <div class="gallery-item">
      <img src="teste-8.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Design Visual</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-3.jpg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Banner</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-4.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Visual Design</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-1.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Arte Gráfica</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-2.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Identidade Visual</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-7.jpg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Motion</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-5.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Design</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-11.jpg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Criação</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-10.jpg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Banner</span></div>
    </div>
    <div class="gallery-item">
      <img src="teste-9.jpeg" alt="Projeto">
      <div class="gallery-item-overlay"><span class="gallery-item-label">Visual</span></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-backdrop" onclick="closeModal()"></div>
    <button class="modal-close" onclick="closeModal()" aria-label="Fechar">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-width="2" stroke-linecap="round">
        <path d="M4 4l10 10M14 4L4 14"/>
      </svg>
    </button>
    <div class="modal-content">
      <img id="modal-img" src="" alt="">
    </div>
  </div>

  <footer>
    © Sato Motion Studios — site em desenvolvimento.
  </footer>

  <script>
    // Gallery click → modal
    const modal    = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => {
        const src = item.querySelector('img').src;
        modalImg.src = src;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      modalImg.src = '';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    // Scroll reveal
    const items = document.querySelectorAll('.gallery-item');
    const obs = new IntersectionObserver(entries => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          entry.target.style.transitionDelay = (i * 0.04) + 's';
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    items.forEach(el => obs.observe(el));

    // Smooth scroll
    let cur = window.pageYOffset, tgt = cur, going = false;
    const ease = 0.08;

    function step() {
      cur += (tgt - cur) * ease;
      if (Math.abs(tgt - cur) < 0.5) { cur = tgt; going = false; }
      window.scrollTo(0, cur);
      if (going) requestAnimationFrame(step);
    }

    window.addEventListener('wheel', e => {
      e.preventDefault();
      tgt = Math.max(0, Math.min(tgt + e.deltaY, document.body.scrollHeight - window.innerHeight));
      if (!going) { going = true; requestAnimationFrame(step); }
    }, { passive: false });
  </script>

</body>
</html>
