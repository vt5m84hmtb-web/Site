<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* ===== ANIMAÇÕES BASE ===== */
    .reveal,
    .reveal-soft {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .reveal-soft {
      transform: translateY(18px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.active,
    .reveal-soft.active {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes modalZoom {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ===== BOTÃO HOME ===== */
    .home-btn {
      position: fixed;
      top: 25px;
      left: 25px;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      z-index: 1000;
      animation: fadeIn 1.2s ease forwards;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .home-btn:hover {
      transform: scale(1.1);
      background: rgba(255,255,255,0.1);
    }

    .home-btn svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    /* ===== VÍDEO ===== */
    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
    }

    .video-bg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: -1;
    }

    header {
      padding: 70px 20px 50px;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -1px;
    }

    header p {
      margin-top: 10px;
      color: #cbd5f5;
    }

    /* ===== GALERIA ===== */
    .gallery {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .gallery img:hover {
      transform: scale(1.06);
      box-shadow: 0 25px 50px rgba(0,0,0,0.65);
    }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal.active {
      display: flex;
    }

    .modal-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.35s ease;
    }

    .modal img {
      max-width: 85%;
      max-height: 85%;
      border-radius: 18px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.85);
      animation: modalZoom 0.4s cubic-bezier(.2,.8,.2,1);
      position: relative;
    }

    .close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1000;
    }

    footer {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- BOTÃO HOME -->
  <a href="index.html" class="home-btn reveal-soft" aria-label="Voltar para o início">
    <svg viewBox="0 0 24 24">
      <path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/>
    </svg>
  </a>

  <!-- VÍDEO -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="Fundo.mp4" type="video/mp4">
    </video>
  </div>
  <div class="overlay"></div>

  <header class="reveal">
    <h1>PORTFÓLIO</h1>
    <p>Contém direitos autorais</p>
  </header>

  <main class="gallery">
    <img src="teste-8.jpeg" class="reveal-soft">
    <img src="teste-3.jpg" class="reveal-soft">
    <img src="teste-4.jpeg" class="reveal-soft">
    <img src="teste-1.jpeg" class="reveal-soft">
    <img src="teste-2.jpeg" class="reveal-soft">
    <img src="teste-7.jpg" class="reveal-soft">
    <img src="teste-5.jpeg" class="reveal-soft">
    <img src="teste-11.jpg" class="reveal-soft">
    <img src="teste-10.jpg" class="reveal-soft">
    <img src="teste-9.jpeg" class="reveal-soft">
  </main>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-bg" onclick="closeModal()"></div>
    <span class="close" onclick="closeModal()">×</span>
    <img id="modal-img">
  </div>

  <footer class="reveal-soft">
    © Sato Motion Studios - o site ainda se encontra em fase de desenvolvimento.
  </footer>

  <!-- JS -->
  <script>
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');

    document.querySelectorAll('.gallery img').forEach(img => {
      img.addEventListener('click', () => {
        modal.classList.add('active');
        modalImg.src = img.src;
      });
    });

    function closeModal() {
      modal.classList.remove('active');
      modalImg.src = '';
    }

    const reveals = document.querySelectorAll('.reveal, .reveal-soft');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    reveals.forEach(el => observer.observe(el));
  </script>
<script>
  let currentScroll = window.pageYOffset;
  let targetScroll = currentScroll;
  let isScrolling = false;

  const ease = 0.08; // quanto menor, mais pesado e suave

  function smoothScroll() {
    currentScroll += (targetScroll - currentScroll) * ease;

    if (Math.abs(targetScroll - currentScroll) < 0.5) {
      currentScroll = targetScroll;
      isScrolling = false;
    }

    window.scrollTo(0, currentScroll);

    if (isScrolling) {
      requestAnimationFrame(smoothScroll);
    }
  }

  window.addEventListener('wheel', e => {
    e.preventDefault();
    targetScroll += e.deltaY;
    targetScroll = Math.max(
      0,
      Math.min(targetScroll, document.body.scrollHeight - window.innerHeight)
    );

    if (!isScrolling) {
      isScrolling = true;
      requestAnimationFrame(smoothScroll);
    }
  }, { passive: false });

  /* âncoras suaves com inércia */
  document.querySelectorAll('a[href^="#"]').forEach(link => {
    link.addEventListener('click', e => {
      const target = document.querySelector(link.getAttribute('href'));
      if (!target) return;

      e.preventDefault();
      targetScroll = target.getBoundingClientRect().top + window.pageYOffset;
      isScrolling = true;
      requestAnimationFrame(smoothScroll);
    });
  });
</script>

</body>
</html>
