<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Escolha seu aparelho:</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="logo.png" type="image/png">

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />

  <style>
    /* Centraliza o bloco principal apenas no index */
    body.index-center .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
    }
  </style>
</head>
<body class="index-center">

  <!-- Video Background -->
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      <source src="Fundo.mp4" type="video/mp4">
    </video>
  </div>

  <section class="hero reveal">
    <h1>Qual o seu aparelho?</h1>
    <div class="hero-buttons reveal-soft">
      <button class="btn-outline" onclick="go('mobile.html')">Mobile</button>
      <button class="btn-outline" onclick="go('tablet.html')">Tablet</button>
      <button class="btn-outline" onclick="go('pc.html')">Pc</button>
    </div>
  </section>

  <script>
    function go(page){
      window.location.href = page;
    }

    const reveals = document.querySelectorAll('.reveal, .reveal-soft');

    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('active');
            observer.unobserve(entry.target);
          }
        });
      },
      { threshold: 0.15 }
    );

    reveals.forEach(el => observer.observe(el));
  </script>

</body>
</html>
